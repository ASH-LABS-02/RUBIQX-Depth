# One-command setup for evaluators:  docker compose up --build   ->  http://localhost:8000
services:
  depthwizard:
    build: .
    image: rubiqx-depth:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data                 # processed scenes persist between runs
      - ./models:/app/models             # put the GAMUS checkpoint in models/da2-gamus-full
    environment:
      - DEPTHWIZARD_MAX_MP=64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/scenes', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
